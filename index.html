<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/admin-favicon.png?v=4" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS home screen icon -->
    <link rel="apple-touch-icon" href="/admin-icon-180.png?v=4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Admin" />

    <!-- Android / Chrome -->
    <meta name="theme-color" content="#F4F4F6" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="robots" content="noindex, nofollow" />
    <title>Admin</title>

    <!--
      O painel abre claro. Isto corre antes de haver React, para nao haver um
      relampago preto no arranque: a classe `theme-light` e posta a mao e o
      JavaScript do tema confirma-a (ou troca-a) logo a seguir. So o 'escuro'
      escrito de proposito e que abre escuro.
    -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('convecta-painel-modo');
          if (m !== 'escuro') document.documentElement.classList.add('theme-light');
        } catch (e) { document.documentElement.classList.add('theme-light'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
