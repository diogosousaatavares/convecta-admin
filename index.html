<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/admin-favicon.png?v=6" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS home screen icon -->
    <link rel="apple-touch-icon" href="/admin-icon-180.png?v=6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Convecta" />

    <!-- Android / Chrome -->
    <meta name="theme-color" content="#F4F4F6" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="robots" content="noindex, nofollow" />
    <title>Convecta</title>

    <!--
      O painel abre claro. Isto corre antes de haver React, para nao haver um
      relampago preto no arranque: a classe `theme-light` e posta a mao e o
      JavaScript do tema confirma-a (ou troca-a) logo a seguir. So o 'escuro'
      escrito de proposito e que abre escuro.
    -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('convecta-painel-modo');
          if (m !== 'escuro') document.documentElement.classList.add('theme-light');
        } catch (e) { document.documentElement.classList.add('theme-light'); }
      })();
    </script>
  </head>
  <body>
        <!--
      Ecra de abertura. Fica aqui, em HTML e CSS puros, e nao num componente
      React: assim pinta no primeiro frame, antes de o bundle existir. Se
      fosse um componente, via-se primeiro um ecra branco e so depois a
      animacao, que e o contrario do que se quer.

      A sequencia: o simbolo e desenhado a traco (preto primeiro, amarelo
      150ms depois), o traco transforma-se em cheio, o conjunto da um salto
      curto, e no fim o amarelo inunda o ecra e desvanece para dentro da app.

      O `--s` encurta ou alonga tudo de uma vez (1 = o tempo de referencia).
      O `data-fim` diz ao script quando pode tirar isto do caminho.
    -->
    <div id="cv-abertura" aria-hidden="true" data-fim="2850">
      <svg class="cv-logo" viewBox="355 840 470 382" aria-hidden="true" focusable="false">
        <g class="cv-g">
          <path class="cv-b" d="M478 962 L594 962 C613 962 629 977 629 996 C629 1015 613 1031 594 1031 L565 1031 C537 1031 512 1054 512 1082 C512 1110 535 1133 563 1133 L658 1133 C665 1133 669 1140 666 1146 C648 1185 613 1212 577 1212 L470 1212 C412 1212 365 1160 365 1100 L365 1075 C365 1013 418 962 478 962 Z"></path>
          <path class="cv-y" d="M512 932 C522 885 560 852 602 852 L708 852 C770 852 815 900 815 965 L815 1012 C815 1070 770 1116 715 1116 L598 1116 C580 1116 564 1101 564 1083 C564 1065 580 1050 598 1050 L636 1050 C665 1050 688 1026 688 997 C688 968 665 944 636 944 L518 944 C512 944 510 938 512 932 Z"></path>
        </g>
        <circle class="cv-flood" cx="690" cy="985" r="40"></circle>
      </svg>
    </div>
    <style>
      #cv-abertura{--s:1;position:fixed;inset:0;z-index:2147483646;display:grid;place-items:center;
        overflow:hidden;background:#fff;
        animation:cv-fim calc(var(--s)*300ms) ease calc(var(--s)*2440ms) forwards}
      @keyframes cv-fim{to{opacity:0;pointer-events:none}}
      /* O limite de 300px existe porque 46% de um ecra de portatil dava um
         logotipo de 800px, o que nao e uma abertura, e um cartaz. */
      .cv-logo{width:min(46%,300px);height:auto;overflow:visible}
      .cv-logo .cv-g,.cv-logo .cv-flood{transform-box:fill-box;transform-origin:center}
      .cv-logo .cv-b,.cv-logo .cv-y{stroke-width:7;stroke-linejoin:round;
        stroke-dasharray:var(--L,2200);stroke-dashoffset:var(--L,2200);fill-opacity:0;
        animation:cv-draw calc(var(--s)*900ms) cubic-bezier(.65,0,.35,1) both,
                  cv-fill calc(var(--s)*320ms) ease-out calc(var(--s)*820ms) forwards}
      .cv-logo .cv-b{stroke:#0b0b0b;fill:#0b0b0b}
      .cv-logo .cv-y{stroke:#ffe45f;fill:#ffe45f;
        animation-delay:calc(var(--s)*150ms),calc(var(--s)*950ms)}
      .cv-logo .cv-g{animation:cv-pop calc(var(--s)*420ms) cubic-bezier(.3,1.6,.5,1) calc(var(--s)*1200ms) both}
      /* 90 e o que faz a mancha chegar aos cantos de um ecra grande: o raio
         fica em ~2000px mesmo com o logotipo no tamanho maximo. */
      .cv-logo .cv-flood{fill:#ffe45f;transform:scale(0);
        animation:cv-flood calc(var(--s)*600ms) cubic-bezier(.7,0,.3,1) calc(var(--s)*1800ms) forwards}
      @keyframes cv-draw{to{stroke-dashoffset:0}}
      @keyframes cv-fill{to{fill-opacity:1;stroke-width:0}}
      @keyframes cv-pop{0%{transform:scale(1) rotate(0)}45%{transform:scale(1.08) rotate(-4deg)}100%{transform:scale(1) rotate(0)}}
      @keyframes cv-flood{to{transform:scale(90)}}
      @keyframes cv-surgir{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion:reduce){
        #cv-abertura{animation-delay:calc(var(--s)*1100ms)}
        .cv-logo .cv-b,.cv-logo .cv-y{stroke-dashoffset:0;fill-opacity:1;stroke-width:0;
          animation:cv-surgir calc(var(--s)*500ms) ease both;animation-delay:0ms}
        .cv-logo .cv-y{animation-delay:calc(var(--s)*120ms)}
        .cv-logo .cv-g,.cv-logo .cv-flood{animation:none}}
    </style>
    <script>
      (function () {
        var e = document.getElementById('cv-abertura');
        if (!e) return;
        // Corre antes do primeiro frame, por estar aqui no corpo logo a
        // seguir ao desenho: da a cada caminho o seu comprimento real.
        try {
          Array.prototype.forEach.call(e.querySelectorAll('.cv-b,.cv-y'), function (c) {
            var L = c.getTotalLength();
            if (L > 0) c.style.setProperty('--L', L);
          });
        } catch (err) {}
        var s = parseFloat(getComputedStyle(e).getPropertyValue('--s')) || 1;
        setTimeout(function () { if (e.parentNode) e.parentNode.removeChild(e); },
                   (parseInt(e.dataset.fim, 10) || 2850) * s);
      })();
    </script>
    <style>
      html:not(.theme-light) #cv-abertura{background:#17171B}
      html:not(.theme-light) .cv-logo .cv-b{stroke:#fff;fill:#fff}
    </style>
    <div id="root"></div>
    <!-- Telemovel deitado: o painel e para se usar ao alto. A app instalada
         ja nao roda (manifest: portrait); no Safari nao se consegue travar a
         rotacao, por isso tapa-se o ecra com um pedido para rodar. -->
    <div id="rodar" aria-hidden="true">
      <div class="rodar-tel"></div>
      <b>Roda o telemóvel</b>
    </div>
    <style>
      #rodar { display: none; }
      @media (pointer: coarse) and (orientation: landscape) and (max-height: 500px) {
        #rodar { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
          position: fixed; inset: 0; z-index: 99999; background: #100E0B; color: #fff; font: 600 18px/1.3 system-ui, sans-serif; }
        .rodar-tel { width: 30px; height: 54px; border: 3px solid #E8C547; border-radius: 7px; animation: rodar-gira 1.6s ease-in-out infinite; }
        @keyframes rodar-gira { 0%, 20% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
